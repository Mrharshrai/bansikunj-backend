# ---------------------------------------------------------------------------
# Bansikunj - backend + PostgreSQL
#   docker compose up --build
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: bansikunj-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bansikunj}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Use a different host port by default so a local PostgreSQL on 5432
      # does not collide with the container.
      - "${DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bansikunj}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bansikunj

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bansikunj-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Load the same local settings as non-Docker runs. The explicit values
    # below override the host-specific parts from .env.
    env_file:
      - .env
    environment:
      # Inside the compose network the DB is reachable by service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Force the discrete POSTGRES_* settings; a host DATABASE_URL would point
      # at localhost and is not reachable from inside this container.
      DATABASE_URL: ""
    # Apply the migrations before starting the API. This is the Compose
    # equivalent of a pre-deploy command.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - bansikunj

volumes:
  postgres_data:

networks:
  bansikunj:
    driver: bridge
